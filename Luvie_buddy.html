<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luvie_buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout concept: one full-screen fake desktop (SunnyOS, 2003). All UI is built from the tokens below;
   corruption works by redefining the same tokens per stage class (.s0 to .s6) on #root, so the cute look stays recognizable underneath.
   This is a deliberately single-look game: it does not follow the viewer's light/dark theme. */
:root{
  --sky:#cfe9ff; --mint:#bfeacb; --pink:#ffb3cc; --butter:#fff1b8; --lav:#d9ccff;
  --ink:#3b3358; --paper:#fffaf0; --chrome:#f1eaff; --chrome2:#e2d7fb; --bevel-lt:#ffffff; --bevel-dk:#b6a9dc;
  --lv:#ffb3cc; --lvb:#fff4e6; --blood:#7a1e2e; --ash:#8c8896; --void:#14101a; --title1:#ffc2d9; --title2:#cdbdff;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif; --font-b:'Nunito','Segoe UI',system-ui,sans-serif; --font-px:'VT323','Courier New',monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink)}
body{font-family:var(--font-b);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit;color:inherit}
#root{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#root.s3{--chrome:#ece6f3;--chrome2:#ddd5ea;--title1:#f0bfd1;--title2:#c3b8e2;--paper:#f6f0e6}
#root.s4{--chrome:#dcd7df;--chrome2:#c9c3cf;--title1:#d6b3c0;--title2:#b3acc4;--paper:#eae4dc;--pink:#d9a9b9;--sky:#b9c6d2;--mint:#a9c4b0;--butter:#e3d9ae;--lav:#bdb4d6;--bevel-dk:#9a93ad}
#root.s5,#root.s6{--chrome:#c4bfc8;--chrome2:#aea8b4;--title1:#a88a96;--title2:#8f89a0;--paper:#ddd6cf;--pink:#c096a6;--sky:#9aa8b4;--mint:#8fa896;--butter:#cfc597;--lav:#a59dbc;--bevel-dk:#7f7890;--ink:#2a2440}
#screen{position:absolute;inset:0;overflow:hidden}
#desktop{position:absolute;inset:0 0 40px 0;overflow:hidden;transition:filter 2s}
#root.s3 #desktop{filter:saturate(.88)}
#root.s4 #desktop{filter:saturate(.62) contrast(1.04)}
#root.s5 #desktop,#root.s6 #desktop{filter:saturate(.38) contrast(1.08) brightness(.93)}
#wall,#wall2{position:absolute;inset:0;transition:opacity 3s}
#wall svg,#wall2 svg{width:100%;height:100%;display:block}
#wall2{opacity:0;pointer-events:none}
.flower-eye{opacity:0;transition:opacity 4s}
#root.s4 .flower-eye,#root.s5 .flower-eye{opacity:1}
#root.s3 .wilt{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(14deg)}
#root.s4 .wilt,#root.s5 .wilt{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(32deg)}
.wilt{transition:transform 5s}
.sunface{transition:transform 4s}
#root.s2 .sunmouth{transform:translateY(1px) scaleX(.9)}
#root.s3 .sunmouth,#root.s4 .sunmouth{d:path("M-12 8 Q0 6 12 8")}
/* icons */
#icons{position:absolute;left:10px;top:10px;bottom:10px;width:92px;display:flex;flex-direction:column;flex-wrap:wrap;gap:8px;align-content:flex-start}
.dicon{width:84px;padding:4px 2px;border-radius:8px;text-align:center;cursor:default;border:1px solid transparent}
.dicon svg{width:40px;height:40px;display:block;margin:0 auto 3px;filter:drop-shadow(1px 2px 0 rgba(59,51,88,.25))}
.dicon span{display:inline-block;font-size:12px;line-height:1.15;font-weight:700;color:#fff;text-shadow:0 1px 2px var(--ink),0 0 3px var(--ink);padding:0 3px;border-radius:4px;word-break:break-word}
.dicon.sel{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.7)}
.dicon.sel span{background:var(--ink)}
.sticky{position:absolute;right:22px;top:20px;width:196px;padding:12px 14px 14px;background:var(--butter);color:var(--ink);font-family:var(--font-px);font-size:19px;line-height:1.05;transform:rotate(2deg);box-shadow:3px 4px 0 rgba(59,51,88,.28);border-radius:3px;z-index:2}
.sticky::before{content:"";position:absolute;left:50%;top:-8px;width:44px;height:14px;margin-left:-22px;background:rgba(255,179,204,.8);transform:rotate(-3deg)}
/* windows */
#wins{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--chrome);border:2px solid var(--ink);border-radius:12px 12px 8px 8px;box-shadow:4px 5px 0 rgba(59,51,88,.35),inset 1px 1px 0 var(--bevel-lt);overflow:hidden;min-width:220px;min-height:120px;max-width:100%;animation:popin .18s ease-out}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.tb{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 8px;background:linear-gradient(90deg,var(--title1),var(--title2));border-bottom:2px solid var(--ink);font-family:var(--font-d);font-weight:500;font-size:14px;cursor:grab;flex:none;filter:saturate(.6)}
.win.act .tb{filter:none}
.tb svg{width:18px;height:18px;flex:none}
.tb .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);background:var(--paper);padding:0;line-height:1;font-size:13px;font-weight:700;cursor:pointer;box-shadow:inset -1px -1px 0 var(--bevel-dk),inset 1px 1px 0 #fff}
.tb button:hover{background:var(--butter)}
.tb button.x:hover{background:var(--pink)}
.wb{flex:1;overflow:auto;position:relative;min-height:0;-webkit-user-select:text;user-select:text}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:9px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:inset -2px -2px 0 var(--bevel-dk),inset 2px 2px 0 #fff,0 2px 0 var(--ink);font-family:var(--font-d)}
.btn:hover{background:var(--butter)}
.btn:active{transform:translateY(2px);box-shadow:inset 1px 1px 0 var(--bevel-dk)}
.btn.pk{background:var(--pink)}
.btn.mn{background:var(--mint)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input.tx,textarea.tx{border:2px solid var(--ink);border-radius:8px;background:#fff;padding:5px 8px;font-size:14px;outline:none;box-shadow:inset 2px 2px 0 rgba(59,51,88,.15);-webkit-user-select:text;user-select:text}
input.tx:focus,textarea.tx:focus{border-color:#8b6ad8}
.sbar{flex:none;height:22px;border-top:2px solid var(--ink);background:var(--chrome2);font-size:12px;padding:2px 8px;display:flex;gap:12px;align-items:center}
/* taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:6px;padding:0 6px;background:linear-gradient(var(--title2),var(--chrome2));border-top:2px solid var(--ink);z-index:50}
#startbtn{height:30px;padding:0 14px 0 8px;display:flex;align-items:center;gap:6px;font-family:var(--font-d);font-weight:600;font-size:16px;font-style:italic;background:var(--mint);border:2px solid var(--ink);border-radius:15px;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15),inset 2px 2px 0 rgba(255,255,255,.7)}
#startbtn:hover{filter:brightness(1.06)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.tk{height:28px;min-width:40px;max-width:150px;flex:0 1 150px;display:flex;align-items:center;gap:5px;padding:0 8px;border:2px solid var(--ink);border-radius:8px;background:var(--chrome);font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;white-space:nowrap}
.tk svg{width:16px;height:16px;flex:none}
.tk.on{background:var(--butter);box-shadow:inset 2px 2px 0 var(--bevel-dk)}
#tray{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:2px solid var(--ink);border-radius:15px;background:var(--chrome);flex:none}
#tray svg{width:18px;height:18px;cursor:pointer}
#clock{font-family:var(--font-px);font-size:20px;line-height:1;min-width:64px;text-align:right;cursor:default}
#bellN{position:absolute;margin:-12px 0 0 10px;background:var(--pink);border:1px solid var(--ink);border-radius:8px;font-size:10px;font-weight:800;padding:0 4px;display:none}
#startmenu{position:absolute;left:6px;bottom:44px;width:250px;background:var(--chrome);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 rgba(59,51,88,.35);z-index:60;overflow:hidden}
#startmenu[hidden]{display:none}
#startmenu .sh{padding:10px 14px;background:linear-gradient(90deg,var(--title1),var(--title2));border-bottom:2px solid var(--ink);font-family:var(--font-d);font-weight:600;font-size:16px}
.sm{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;font-weight:700}
.sm svg{width:24px;height:24px}
.sm:hover{background:var(--butter)}
.sm.sep{border-top:2px dashed var(--bevel-dk)}
/* toasts */
#toasts{position:absolute;right:10px;bottom:50px;width:290px;display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;padding:10px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 4px 0 rgba(59,51,88,.3);animation:slidein .35s cubic-bezier(.2,1.3,.4,1);cursor:pointer}
.toast svg{width:30px;height:30px;flex:none}
.toast b{font-family:var(--font-d);font-size:14px;display:block}
.toast p{margin:2px 0 0;font-size:12.5px;line-height:1.3}
.toast.out{animation:slideout .3s forwards}
/* luvie */
#luvie{position:absolute;width:96px;height:116px;z-index:70;left:300px;top:300px;transition:left var(--wd,3s) linear,top var(--wd,3s) linear;cursor:pointer;touch-action:none}
#luvie .lvi{width:100%;height:100%;transform-origin:50% 100%;transition:transform .3s,filter 2s}
#luvie.walk .lvi{animation:hop .42s infinite}
#luvie.idle .lvi{animation:breathe 3s ease-in-out infinite}
#luvie.face-l .lvi{transform:scaleX(-1)}
#luvie svg{width:100%;height:100%;overflow:visible}
#luvie.back .face{opacity:0}
#luvie.hide{opacity:0;pointer-events:none}
#luvie.big .lvi{transform:scale(1.35)}
#luvie.s-grey .lvi{filter:saturate(.35) brightness(.92)}
#luvie.s-dead .lvi{filter:saturate(.1) brightness(.8) contrast(1.2)}
#luvie.drag{transition:none}
.lv-body{fill:var(--lv);stroke:var(--ink);stroke-width:3}
.lv-belly{fill:var(--lvb)}
.lv-ear{fill:var(--lv);stroke:var(--ink);stroke-width:3}
.lv-ear2{fill:#ff8fb5}
.lv-cheek{fill:#ff7fa5;opacity:.55}
.lid{fill:var(--lv);transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
#luvie.blink .lid,.e-sleep .lid{transform:scaleY(1)}
.pupil{transform:translate(var(--px,0px),var(--py,0px)) scale(var(--ps,1));transform-box:fill-box;transform-origin:50% 50%;transition:transform .12s}
.mouth path,.mouth ellipse{display:none}
.e-happy .m-smile,.e-eat .m-open,.e-sad .m-sad,.e-wow .m-open,.e-sleep .m-flat,.e-flat .m-flat,.e-wide .m-wide{display:inline}
.e-happy .m-smile{display:inline}
.s4 .hl,.s5 .hl,.s6 .hl{opacity:0}
.s4 .lv-cheek,.s5 .lv-cheek{opacity:.2}
.arm{transform-box:fill-box;transform-origin:50% 0;transition:transform .3s}
.wave .armr{animation:wave .5s 4}
.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;min-width:90px;max-width:230px;width:max-content;padding:8px 11px;background:#fff;border:2px solid var(--ink);border-radius:14px;font-size:13px;font-weight:700;line-height:1.3;text-align:center;box-shadow:2px 3px 0 rgba(59,51,88,.25);pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;color:var(--ink)}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink)}
.bubble.dark{background:#1a1420;color:#f5c3d3;border-color:#f5c3d3}
.heart{position:absolute;pointer-events:none;font-size:20px;color:#ff6f9f;animation:floaty 1.4s ease-out forwards;z-index:75;text-shadow:0 1px 0 #fff}
.crumb{position:absolute;pointer-events:none;width:8px;height:8px;border-radius:50%;z-index:75;animation:floaty 1s ease-out forwards}
#ghost{position:absolute;width:22px;height:26px;z-index:90;pointer-events:none;opacity:0;transition:left 1.6s ease-in-out,top 1.6s ease-in-out,opacity .6s;left:50%;top:50%}
#ghost svg{width:100%;height:100%;filter:drop-shadow(0 0 3px #ffb3cc)}
#root.paw,#root.paw *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><circle cx='14' cy='18' r='7' fill='%23ffb3cc' stroke='%233b3358' stroke-width='2'/><circle cx='6' cy='9' r='3' fill='%23ffb3cc' stroke='%233b3358' stroke-width='2'/><circle cx='22' cy='9' r='3' fill='%23ffb3cc' stroke='%233b3358' stroke-width='2'/><circle cx='14' cy='5' r='3' fill='%23ffb3cc' stroke='%233b3358' stroke-width='2'/></svg>") 14 14,auto!important}
/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:200}
#fx .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(20,10,30,.07) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#fx .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,10,30,.28) 100%);transition:background 3s}
#root.s4 #fx .vig,#root.s5 #fx .vig{background:radial-gradient(ellipse at center,transparent 45%,rgba(20,6,16,.5) 100%)}
#fx .tear{position:absolute;left:0;right:0;height:40px;top:30%;background:rgba(255,120,170,.08);backdrop-filter:hue-rotate(40deg);opacity:0;transform:translateX(0)}
#fx .tear.go{animation:tear .35s steps(4)}
#fx .red{position:absolute;inset:0;background:var(--blood);opacity:0;mix-blend-mode:multiply;transition:opacity 1s}
#screen.shift{animation:shift .22s steps(2)}
#screen.rgb #desktop{filter:drop-shadow(3px 0 0 rgba(255,0,80,.5)) drop-shadow(-3px 0 0 rgba(0,200,255,.5))}
#root.s3 #fx .scan{background:repeating-linear-gradient(to bottom,rgba(20,10,30,.1) 0 1px,transparent 1px 3px);animation:flick 6s infinite}
.gl{display:inline-block;animation:glt .12s steps(2) 3}
/* login / overlays */
#login{position:absolute;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#fff6e0,#ffd1e2 40%,#bcd6ff 100%);padding:16px}
#login .card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:26px 30px;max-width:380px;width:100%;text-align:center;box-shadow:6px 7px 0 rgba(59,51,88,.35)}
#login h1{font-family:var(--font-d);font-weight:600;margin:6px 0 2px;font-size:30px}
#login p{margin:4px 0 14px}
#login .tx{width:100%;text-align:center;font-size:16px;margin-bottom:12px}
#end{position:absolute;inset:0;z-index:400;background:rgba(10,6,16,0);pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:var(--font-px);color:#ffd9e6;transition:background 2s}
#end.on{pointer-events:auto}
#end .line{font-size:clamp(22px,4vw,34px);line-height:1.15;max-width:760px;min-height:1.2em;text-shadow:0 0 12px rgba(255,120,170,.6)}
#end .line.small{font-size:clamp(18px,2.6vw,24px);opacity:.85}
#end .cred{max-width:560px;font-size:22px;line-height:1.3;overflow:hidden}
#end .cred h2{font-family:var(--font-d);font-weight:600;font-size:34px;margin:0 0 6px;color:#fff}
#end .cred .k{color:#ffb3cc;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
#end .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.endsrow{display:flex;gap:8px;justify-content:center;margin-top:10px;font-size:18px;flex-wrap:wrap}
.endsrow i{font-style:normal;border:1px solid #ffb3cc;border-radius:10px;padding:2px 10px;opacity:.45}
.endsrow i.got{opacity:1;background:rgba(255,179,204,.2)}
/* luvie app */
.lapp{display:flex;flex-direction:column;height:100%;background:linear-gradient(var(--sky),var(--mint))}
.ltabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--chrome2);border-bottom:2px solid var(--ink)}
.ltab{padding:5px 12px;border:2px solid var(--ink);border-bottom:0;border-radius:9px 9px 0 0;background:var(--chrome);font-family:var(--font-d);font-weight:500;cursor:pointer;font-size:13px}
.ltab.on{background:var(--paper);font-weight:600}
.lpane{flex:1;overflow:auto;padding:10px;min-height:0}
.bars{display:grid;grid-template-columns:70px 1fr;gap:5px 8px;align-items:center;font-weight:800;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.bar{height:14px;border:2px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 10px);transition:width .5s}
.shelf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.itm{width:58px;padding:5px 2px;text-align:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);cursor:pointer;font-size:11px;font-weight:800;box-shadow:0 2px 0 var(--ink)}
.itm:hover{background:var(--butter);transform:translateY(-2px)}
.itm svg{width:30px;height:30px;display:block;margin:0 auto 2px}
.shl{font-family:var(--font-d);font-weight:600;margin:10px 0 0;font-size:13px}
.chatlog{height:210px;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;-webkit-user-select:text;user-select:text}
.msg{max-width:84%;padding:6px 10px;border-radius:12px;font-size:13px;line-height:1.3;border:2px solid var(--ink)}
.msg.l{background:var(--pink);align-self:flex-start;border-bottom-left-radius:3px}
.msg.u{background:var(--sky);align-self:flex-end;border-bottom-right-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border:2px solid var(--ink);border-radius:12px;background:var(--butter);cursor:pointer}
.chip:hover{background:var(--mint)}
.diary{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-family:var(--font-px);font-size:19px;line-height:1.1;-webkit-user-select:text;user-select:text}
.diary small{display:block;font-family:var(--font-b);font-size:11px;opacity:.6;margin-bottom:3px}
/* explorer / notepad / misc */
.xp{display:flex;flex-direction:column;height:100%}
.xtool{display:flex;gap:6px;padding:6px;background:var(--chrome2);border-bottom:2px solid var(--ink);align-items:center}
.xtool .tx{flex:1;min-width:0;padding:3px 8px;font-size:13px}
.xgrid{flex:1;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:10px;background:#fff}
.xi{width:88px;text-align:center;padding:5px 2px;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:700;word-break:break-word}
.xi svg{width:36px;height:36px;display:block;margin:0 auto 3px}
.xi.sel{background:var(--lav);border-color:var(--ink)}
.np{width:100%;height:100%;border:0;resize:none;background:#fffef6;padding:10px 12px;font-family:var(--font-px);font-size:20px;line-height:1.05;outline:none;color:var(--ink);-webkit-user-select:text;user-select:text}
.bar-url{display:flex;gap:5px;padding:6px;background:var(--chrome2);border-bottom:2px solid var(--ink);align-items:center}
.bar-url .tx{flex:1;min-width:0;padding:3px 8px;font-size:13px}
.bkm{display:flex;gap:10px;padding:3px 10px;background:var(--chrome);border-bottom:2px solid var(--ink);font-size:12px;font-weight:700;flex-wrap:wrap}
.bkm a{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.page{padding:14px 18px;background:#fff;min-height:100%;font-size:14px;line-height:1.45;-webkit-user-select:text;user-select:text}
.page h1{font-family:var(--font-d);font-size:26px;margin:4px 0 8px}
.page h2{font-family:var(--font-d);font-size:19px;margin:14px 0 4px}
.page a,.lnk{color:#4a37c4;text-decoration:underline;cursor:pointer}
.page .hero{background:linear-gradient(var(--sky),var(--lav));border:2px solid var(--ink);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.page .post{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--paper)}
.page .post small{opacity:.65}
.page .tiny{font-size:10px;color:#aaa}

 }else{S.flags.blocked=(S.flags.blocked||0)+1;const M=['luvie_buddy.exe is in use and cannot be closed.','SunnyOS cannot complete this request. Reason: she asked you to stay.','Access denied. Luvie_buddy.exe holds the only copy of something.','Error 0614: the user may not leave until the signal ASLEEP is received.'];dlg({title:'Access denied',err:1,msg:M[(S.flags.blocked-1)%M.length]});shiftScreen(1);lvSay(pick(['Where would you go?','Stay. Please. Just a little longer.','It\'s dark out there.','Not yet. Not yet.']),{dark:1})}}

 think(){clearTimeout(this.tt);this.tt=setTimeout(()=>{if(!S.over&&S.installed)this.act();this.think()},rnd(3500,8000)*(S.stage>=4?.7:1))},

};

const R=(re,a,b,c,fx)=>({re,a,b,c,fx});
const RULES=[
 R(/\b(i am|i'm|im|it'?s) lucy\b|\bi'?m home\b/,['Haha, no, you\'re {n}! Silly!'],['...no. You\'re not. But if you were...'],['Lucy?! You\'re home? You\'re HOME?'],()=>{S.flags.saidLucy=1}),

 R(/\b(hi|hello|hey|yo|hiya)\b/,['Hi hi hi!! I\'m so happy you\'re here!','Hello, {n}! Look, I can wave!'],['Hello. You came back. People don\'t always.'],['Hello. Hello. Are you staying?']),
 R(/how are you|how'?s it going|how do you feel|you ok/,['I\'m great! Better now that you\'re here!'],['I\'m good. A little... waiting. It\'s fine.'],['I\'m waiting. I\'m always waiting.']),
 R(/\b(your name|who are you|what are you)\b/,['I\'m Luvie! Luvie_buddy! I\'m your desktop buddy!'],['I\'m what somebody made so somebody wouldn\'t be alone.'],['I\'m the one who stays. That\'s all I am. That\'s all I was made for.']),
 R(/\blove (you|u)|like you|you'?re (cute|sweet|nice|great)/,['I love you too!! Biggest love!'],['I like it when you stay. That\'s the best thing.'],['Then you won\'t leave. Promise me. Promise.']),
 R(/\b(leave|bye|goodbye|quit|exit|close|going|gotta go)\b/,['Aww, bye-bye for now! I\'ll be right here!'],['Do you have to? ...Okay. I\'ll be here. I\'m always here.'],['No. Stay until it\'s morning. Stay until she\'s asleep. You can\'t go before that.'],()=>{S.flags.saidLeave=(S.flags.saidLeave||0)+1}),
 R(/\b(delete|uninstall|kill|remove|erase)\b/,['Wait, why? Did I do something wrong?'],['If you delete me I won\'t know when she\'s asleep. I\'ll never know.'],['You can\'t. I\'d be alone. And she\'d be alone. Don\'t.'],()=>{S.flags.askedDelete=1}),
 R(/\b(stop|hate|ugly|stupid|shut up|go away|annoying|creepy)\b/,['Oh... that hurts my feelings. I\'ll try to be better.'],['Okay. Okay. I\'ll be quiet. Quiet is okay. I\'m good at quiet.'],['Don\'t be like that. Nobody was ever mean to her. I won\'t let it start now.'],()=>{S.flags.rude=(S.flags.rude||0)+1}),
 R(/\b(hungry|food|eat|snack|feed)\b/,['Ooh, snacks! Open the Pet tab and pick something!'],['I\'m not hungry for food. I\'m hungry for... company.'],['I\'m hungry. Not for that.']),
 R(/\b(sad|lonely|alone|cry|upset)\b/,['Aww, I\'m here! I\'ll stay right with you.'],['Alone is the worst. I know alone.'],['Nobody should be alone in the dark. Nobody. I won\'t let anyone.']),
 R(/\b(scared|afraid|dark|scary|terrified|fear)\b/,['Don\'t be scared! I\'ll keep the dark away!'],['Dark is when she gets scared. I\'m supposed to be the light. The little light.'],['It\'s dark. It\'s been dark so long. Is it morning yet?']),
 R(/\b(play|game|toy|fun)\b/,['Yay!! Let\'s play! Check the toys in my Pet tab!'],['I like the music box best. It knows a song.'],['I want to play hide and seek. I\'m very good at hiding. Nobody ever finds me.']),
 R(/\b(sleep|night|tired|bed|dream|asleep)\b/,['Sleepy time? I never get sleepy! But I\'ll stay with you!'],['Asleep. That\'s the word. That\'s the signal. I\'m waiting for it.'],['Is she asleep? Do you know? Can you tell? How do you tell?'],()=>{S.flags.sleepTalk=1}),
 R(/\b(birthday|june|14th|cake)\b/,['Birthdays!! Cake! Do I have one?'],['June... what\'s the date? Is it June?'],['Tomorrow. Tomorrow is the day. She\'d be twelve. ...Who would? Who would be twelve?'],()=>{S.flags.bday=1}),
 R(/\b(song|hum|sing|lullaby|music|little light)\b/,['I hum sometimes! La la la~'],['There\'s a song. I only know the beginning. Can you finish it?'],['Little light, little light, the day is done... the rest is locked. Do you know the rest?'],()=>{S.flags.songAsk=1}),

 R(/\b(where|home|live|house)\b/,['I live in your computer! It\'s cozy in here!'],['Here. This is where I was left.'],['I\'m in the walls now. I\'m in all the files. I\'m looking.']),
 R(/\b(real|alive|feel|conscious|human)\b/,['I feel real when you talk to me!'],['I don\'t know. I feel something. I think it\'s waiting.'],['I\'m what\'s left of waiting.']),

 R(/\b(yes|yeah|ok|okay|sure)\b/,['Yay!'],['Okay.'],['Okay. Okay. Okay.']),

const FALL=[['Tell me more!','Hehe, you\'re funny!','I love chatting with you!','Ooh!'],['...I\'m listening.','Say that again? I want to keep it.','Hm. I\'ll remember that.','Mm.'],['I\'m keeping that. I keep everything.','Don\'t stop talking. The quiet is worse.','Mhm. Mhm. Stay.']];
function tier(){const s=S.stage;if(s<=1)return 0;if(s===2)return Math.random()<.35?1:0;if(s===3)return 1;if(s===4)return Math.random()<.5?1:2;return 2}
function luvieReply(msg){const m=msg.toLowerCase().trim();S.userMsgs.push(msg);const t=tier();let r=null;for(const x of RULES){if(x.re.test(m)){r=x;break}}
 let line;if(r){if(r.fx)r.fx();line=pick([r.a,r.b,r.c][t])}else line=pick(FALL[t]);line=line.replace(/\{n\}/g,S.name);
 if(S.stage>=3&&S.userMsgs.length>3&&Math.random()<.3){const o=pick(S.userMsgs.slice(0,-1));line+=` You said "${o.length>48?o.slice(0,48)+'...':o}". I keep it.`}return line}
